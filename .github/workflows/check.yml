name: check

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"  # Mondays: the secrets job scans the whole history
  workflow_dispatch:  # or by hand, from the Actions tab

permissions:
  contents: read  # read the code; nothing else

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # to compare with main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.1  # pinned: a new release never fails a PR by itself
      # only the Python files this PR changes: src/ has known older debt
      - run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF...HEAD" -- '*.py')
          if [ -n "$files" ]; then ruff check $files; else echo "No Python changes."; fi

  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[student,dev]"
      # a few key tests (marked ci): fakes only, no secrets, never an eval
      - run: python -m pytest -q -m ci

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # the action lists a PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # a PR's commits, or on schedule the whole history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
